<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dojo Pesadilla">

<title>Dojo Pesadilla Team</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#080810;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden}
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap');
.bebas{font-family:'Bebas Neue',cursive}
input,select,textarea{font-family:inherit;color:#fff;background:#10101c;border:1px solid #252535;border-radius:8px;padding:10px 13px;width:100%;font-size:15px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:#e8350a}
input::placeholder,textarea::placeholder{color:#8080b0}
select option{background:#10101c}
textarea{resize:vertical;min-height:70px}
button{cursor:pointer;font-family:'Bebas Neue',cursive;letter-spacing:2px;border:none;border-radius:8px;transition:all .15s}
button:active{transform:scale(.97)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#252535;border-radius:4px}

/* LAYOUT */
#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:#10101c;border-bottom:1px solid #252535;padding:0 14px;display:flex;align-items:center;justify-content:space-between;height:54px}
.topbar-logo{font-family:'Bebas Neue',cursive;font-size:15px;color:#fff;font-weight:900;letter-spacing:2px}
.content{flex:1;padding:14px;padding-bottom:76px;max-width:600px;margin:0 auto;width:100%}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#10101c;border-top:1px solid #252535;display:flex;height:62px}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:#9090c0;font-size:8px;letter-spacing:1px;text-transform:uppercase;font-weight:700;user-select:none;padding:0 2px;transition:color .2s}
.bni.on{color:#e8350a}
.bni svg{width:20px;height:20px}

/* SPLASH */
#splash{position:fixed;inset:0;background:#080810;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;background-image:radial-gradient(ellipse at 50% 25%,#e8350a22 0%,transparent 65%);padding:20px}
.splash-academy{font-size:12px;letter-spacing:5px;color:#aaaacc;text-transform:uppercase;margin-bottom:10px;text-align:center}
.splash-title1{font-family:'Bebas Neue',cursive;font-size:38px;color:#e8350a;letter-spacing:5px;text-align:center;line-height:1}
.splash-title2{font-family:'Bebas Neue',cursive;font-size:34px;color:#fff;letter-spacing:4px;text-align:center;line-height:1;margin-bottom:8px}
.splash-disc{font-size:12px;letter-spacing:4px;color:#fff;text-transform:uppercase;text-align:center;margin-bottom:28px}
.login-box{width:min(320px,92vw);background:#14141f;border:1px solid #252535;border-radius:14px;padding:24px 20px}
.login-title{font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:3px;color:#fff;text-align:center;margin-bottom:16px}

/* CARDS */
.card{background:#14141f;border:1px solid #252535;border-radius:12px;padding:14px;margin-bottom:12px}
.card-title{font-family:'Bebas Neue',cursive;font-size:16px;letter-spacing:2px;color:#fff;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.section-title{font-family:'Bebas Neue',cursive;font-size:21px;letter-spacing:3px;margin-bottom:14px;color:#fff}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;letter-spacing:2px;color:#fff;text-transform:uppercase;margin-bottom:5px}
.flex-row{display:flex;gap:8px;align-items:center}
.divider{height:1px;background:#252535;margin:12px 0}

/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.stat-card{border-radius:12px;padding:12px}
.stat-val{font-family:'Bebas Neue',cursive;font-size:32px;line-height:1;color:#fff}
.stat-label{font-size:10px;letter-spacing:2px;color:#ccc;text-transform:uppercase;margin-top:2px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;font-size:15px;color:#fff}
.btn-primary{background:#e8350a;width:100%}
.btn-outline{background:transparent;border:1px solid #252535;color:#fff}
.btn-green{background:#22c55e}
.btn-red{background:#ef4444}
.btn-gold{background:#f0b429;color:#000}
.btn-purple{background:#a855f7}
.btn-sm{padding:7px 13px;font-size:13px}
.btn-block{width:100%}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px}
.bg-green{background:#22c55e20;color:#22c55e;border:1px solid #22c55e}
.bg-red{background:#ef444420;color:#ef4444;border:1px solid #ef4444}
.bg-gold{background:#f0b42920;color:#f0b429;border:1px solid #f0b429}
.bg-muted{background:#6060a020;color:#8080b0;border:1px solid #8080b0}
.bg-purple{background:#a855f720;color:#a855f7;border:1px solid #a855f7}
.bg-blue{background:#3b82f620;color:#3b82f6;border:1px solid #3b82f6}

/* TABS */
.tabs{display:flex;gap:5px;margin-bottom:13px;overflow-x:auto;padding-bottom:3px}
.tab{padding:5px 12px;border-radius:20px;border:1px solid #252535;font-size:12px;cursor:pointer;white-space:nowrap;color:#ccc;font-weight:700;letter-spacing:1px;transition:all .15s;background:transparent;font-family:inherit}
.tab.on{background:#e8350a;border-color:#e8350a;color:#fff}
.search-box{width:100%;background:#14141f;border:1px solid #252535;color:#fff;font-family:inherit;font-size:15px;padding:9px 13px;border-radius:8px;outline:none;margin-bottom:12px}
.search-box:focus{border-color:#e8350a}

/* MEMBER */
.member-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #252535;cursor:pointer}
.member-item:last-child{border-bottom:none}
.m-av{width:40px;height:40px;border-radius:50%;background:#e8350a;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:17px;color:#fff;flex-shrink:0}
.m-info{flex:1;min-width:0}
.m-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.m-sub{font-size:11px;color:#aaaacc}

/* ALERT */
.alert{background:#f0b42912;border:1px solid #f0b429;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:9px;font-size:13px}
.alert-red{background:#ef444412;border-color:#ef4444}
.alert-purple{background:#a855f712;border-color:#a855f7}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:#000c;z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#10101c;border:1px solid #252535;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px;max-height:90vh;overflow-y:auto;animation:slideUp .28s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-family:'Bebas Neue',cursive;font-size:19px;letter-spacing:3px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.modal-close{background:#252535;border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}

/* SCHEDULE */
.day-header{font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:3px;color:#e8350a;margin:16px 0 8px}
.sched-group{background:#14141f;border:1px solid #252535;border-radius:12px;padding:13px 15px;margin-bottom:9px}
.sched-turno{font-family:'Bebas Neue',cursive;font-size:14px;letter-spacing:2px;margin-bottom:4px}
.sched-time{font-family:'Bebas Neue',cursive;font-size:25px;letter-spacing:1px}
.sched-disc{font-size:12px;font-weight:700;letter-spacing:1px;margin-top:4px;color:#fff}
.sched-inst{font-size:11px;color:#aaaacc;margin-top:2px}

/* FINANCE */
.tx-item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #252535}
.tx-item:last-child{border-bottom:none}
.tx-label{font-size:14px;font-weight:600;color:#fff}
.tx-sub{font-size:11px;color:#aaaacc}
.tx-amt{font-family:'Bebas Neue',cursive;font-size:19px}
.ing{color:#22c55e}.eg{color:#ef4444}

/* ATTENDANCE TOGGLE */
.toggle{position:relative;width:42px;height:23px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#252535;border-radius:23px;cursor:pointer;transition:.3s}
.slider:before{content:'';position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.slider{background:#22c55e}
input:checked+.slider:before{transform:translateX(19px)}

/* PROFILE */
.profile-hero{background:linear-gradient(135deg,#e8350a,#7a1a05);border-radius:13px;padding:18px;margin-bottom:13px;display:flex;align-items:center;gap:14px}
.ph-av{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:26px;color:#fff;border:2px solid rgba(255,255,255,.35);flex-shrink:0}
.ph-name{font-family:'Bebas Neue',cursive;font-size:23px;line-height:1;color:#fff}
.dr{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #252535;font-size:14px;color:#fff}
.dr:last-child{border-bottom:none}
.dl{color:#aaaacc;font-size:11px;min-width:110px;letter-spacing:1px;text-transform:uppercase;padding-top:2px}

/* PRODUCT */
.product-card{background:#14141f;border:1px solid #252535;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.product-emoji{font-size:36px;flex-shrink:0}
.product-name{font-weight:700;font-size:15px;color:#fff}
.product-desc{font-size:12px;color:#aaaacc;margin-top:2px}
.product-price{font-family:'Bebas Neue',cursive;font-size:22px;color:#f0b429;margin-top:4px}

/* OPINION */
.opinion-card{background:#14141f;border:1px solid #252535;border-radius:12px;padding:14px;margin-bottom:10px}
.stars{color:#f0b429;font-size:16px;margin-top:4px}

/* CHART */
.chart-bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding:6px 0}
.bar-group{flex:1;display:flex;gap:2px;align-items:flex-end}
.bar{flex:1;border-radius:3px 3px 0 0;min-height:2px;transition:height .4s}
.chart-labels{display:flex;gap:5px}
.chart-label{flex:1;text-align:center;font-size:10px;color:#aaaacc;padding-top:4px}
.sparring-badge{display:inline-block;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:2px;margin-top:4px}

/* TOAST */
#toast-el{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#14141f;border:1px solid #252535;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;box-shadow:0 4px 24px #000a;color:#fff;display:none}

/* EMPTY */
.empty{text-align:center;padding:32px 16px;color:#8080b0}
.empty .ei{font-size:42px;margin-bottom:10px}

.belt-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.belt-opt{padding:5px 11px;border-radius:6px;border:2px solid #252535;font-size:12px;cursor:pointer;font-weight:700;color:#fff;transition:all .15s;background:transparent;font-family:inherit}
.belt-on{border-color:#f0b429!important;color:#f0b429!important}
.quota-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #252535}
.quota-row:last-child{border-bottom:none}
.notif-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #252535}
</style>
</head>

let STATE = {
  role: null, // 'admin' | 'alumno'
  user: null,
  page: 'dashboard',
  members: [],
  ingresos: [],
  egresos: [],
  attendance: {},
  opinions: [],
  notifications: [],
  modal: null,
  modalData: {},
  cart: {},
  memberFilter: '',
  memberTab: 'todos',
  finTab: 'resumen',
};

function initDB(){
  const ver = DB.get('version');
  if(!ver || ver < 4){
    DB.set('members', SEED_MEMBERS);
    DB.set('ingresos', []);
    DB.set('egresos', []);
    DB.set('attendance', {});
    DB.set('opinions', []);
    DB.set('notifications', []);
    DB.set('version', 4);
  }
  STATE.members    = DB.get('members')      || SEED_MEMBERS;
  STATE.ingresos   = DB.get('ingresos')     || [];
  STATE.egresos    = DB.get('egresos')      || [];
  STATE.attendance = DB.get('attendance')   || {};
  STATE.opinions   = DB.get('opinions')     || [];
  STATE.notifications = DB.get('notifications') || [];
}

function save(key){ DB.set(key, STATE[key]); }

// =======================================================
// UTILS
// =======================================================
function fmtDate(s){ if(!s||s==='--') return '--'; const[y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthKey(){ return new Date().toISOString().slice(0,7); }
function daysUntil(s){ if(!s) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.ceil((new Date(s+'T00:00:00')-t)/86400000); }
function initials(n,a){ return ((n||'')[0]||'').toUpperCase()+((a||'')[0]||'').toUpperCase(); }
function isInactive(mid){
  const t=new Date(); t.setHours(0,0,0,0);
  for(let i=0;i<14;i++){
    const d=new Date(t); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const keys=Object.keys(STATE.attendance).filter(k=>k.endsWith('_'+ds));
    for(const k of keys){ if(STATE.attendance[k][mid]) return false; }
  }
  return true;
}
function sparringSabados(){
  const res=[];
  const now=new Date();
  for(let m=0;m<3;m++){
    let cnt=0;
    for(let d=1;d<=31;d++){
      const dt=new Date(now.getFullYear(),now.getMonth()+m,d);
      if(dt.getMonth()!=(now.getMonth()+m)%12 && m>0) break;
      if(dt.getDay()===6){ cnt++; if(cnt===1||cnt===3) res.push(dt.toISOString().slice(0,10)); }
    }
  }
  return res;
}

function toast(msg){
  const el=document.getElementById('toast-el');
  el.textContent=msg; el.style.display='block';
  clearTimeout(window._toastT);
  window._toastT=setTimeout(()=>el.style.display='none',2800);
}

// =======================================================
// RENDER ENGINE
// =======================================================
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') el.className=v;
    else if(k==='style'&&typeof v==='object') Object.assign(el.style,v);
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='checked') el.checked=v;
    else if(k==='value') el.value=v||'';
    else if(k==='placeholder') el.placeholder=v;
    else if(k==='type') el.type=v;
    else if(k==='maxLength') el.maxLength=v;
    else if(k==='rows') el.rows=v;
    else if(k==='htmlFor') el.htmlFor=v;
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null||c===false||c===undefined) return;
    el.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  });
  return el;
}
function div(cls,...c){ return h('div',{class:cls},...c); }
function span(cls,...c){ return h('span',{class:cls},...c); }
function btn(cls,label,onClick){ return h('button',{class:'btn '+cls,onClick},label); }
function field(label,input){ return div('field',h('label',{},label),input); }
function inp(type,placeholder,val,onInput){
  const el=h('input',{type:type||'text',placeholder,value:val||''});
  if(onInput) el.addEventListener('input',onInput);
  return el;
}
function sel(options,val,onChange){
  const el=h('select',{});
  options.forEach(([v,l])=>{ const o=h('option',{value:v},l); if(v==val) o.selected=true; el.appendChild(o); });
  if(onChange) el.addEventListener('change',onChange);
  return el;
}
function svgIcon(path){
  const ns='http://www.w3.org/2000/svg';
  const s=document.createElementNS(ns,'svg');
  s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','2'); s.setAttribute('viewBox','0 0 24 24');
  s.innerHTML=path; return s;
}

    container.appendChild(lc);

function pageAsistencia(){
  const allTurnos=SCHEDULE.flatMap(g=>g.turnos.map(t=>({...t,dias:g.dias})));
  let claseIdx=0, fecha=todayStr();
  const wrap=div('');
  wrap.appendChild(div('section-title','ASISTENCIA'));
  const info=div(''); info.style.cssText='background:#14141f;border:1px solid #252535;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#fff';
  info.innerHTML='? <strong>Usable desde PC y celular.</strong> Selecciona la clase y fecha.';
  wrap.appendChild(info);
  const claseEl=sel(allTurnos.map((t,i)=>[i,t.dias+' ? '+t.hora]),0,e=>{ claseIdx=Number(e.target.value); renderList(); });
  const fechaEl=inp('date','',fecha,e=>{ fecha=e.target.value; renderList(); });
  wrap.appendChild(field('Clase',claseEl));
  wrap.appendChild(field('Fecha',fechaEl));
  const statsEl=div(''); statsEl.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:10px';
  wrap.appendChild(statsEl);
  const listWrap=div('card'); listWrap.style.padding='0 14px';
  wrap.appendChild(listWrap);
  function renderList(){
    const key=claseIdx+'_'+fecha;
    const att=STATE.attendance[key]||{};
    const presentes=STATE.members.filter(m=>att[m.id]).length;
    statsEl.innerHTML='';
    statsEl.appendChild(h('span',{style:'font-size:13px;color:#aaaacc'},'Presentes: '));
    statsEl.appendChild(h('strong',{style:'color:#22c55e'},String(presentes)));
    statsEl.appendChild(h('span',{style:'font-size:13px;color:#aaaacc'},' / '+STATE.members.length));
    statsEl.appendChild(h('span',{class:'badge bg-green'},Math.round(presentes/Math.max(STATE.members.length,1)*100)+'% asistencia'));
    listWrap.innerHTML='';
    if(!STATE.members.length){ const e=div('empty'); e.innerHTML='<div class="ei">?</div><div>No hay alumnos</div>'; listWrap.appendChild(e); return; }
    STATE.members.forEach(m=>{
      const row=div(''); row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #252535';
      row.appendChild(div('',h('div',{style:'font-weight:700;font-size:14px;color:#fff'},m.nombre+' '+m.apellido),h('div',{style:'font-size:11px;color:#aaaacc'},(m.actividad||'')+' ? '+(m.belt||''))));
      const tog=h('label',{class:'toggle'});
      const chk=h('input',{type:'checkbox'});
      chk.checked=!!att[m.id];
      chk.addEventListener('change',e=>{
        const k=claseIdx+'_'+fecha;
        if(!STATE.attendance[k]) STATE.attendance[k]={};
        STATE.attendance[k][m.id]=e.target.checked;
        save('attendance');
        const p=STATE.members.filter(x=>STATE.attendance[k][x.id]).length;
        statsEl.querySelector('strong').textContent=String(p);
      });
      const sl=h('span',{class:'slider'});
      tog.appendChild(chk); tog.appendChild(sl);
      row.appendChild(tog); listWrap.appendChild(row);
    });
  }
  renderList();
  return wrap;
}

  const bg=div('modal-bg');
  bg.addEventListener('click',e=>{ if(e.target===bg){ STATE.modal=null; render(); } });
  const closeBtn=h('button',{class:'modal-close',onClick:()=>{ STATE.modal=null; render(); }},'?');
  const m=div('modal');
  m.appendChild(div('modal-title',title,closeBtn));
  m.appendChild(content);
  bg.appendChild(m);
  return bg;
}

function modalAddMember(){
  const f={nombre:'',apellido:'',doc:'',cel:'',nac:'',dir:'',actividad:'',belt:'Blanco',venc:'',arancel:0,arancelLabel:'',obs:'',pin:''};
  const ni=inp('text','Nombre',''); ni.addEventListener('input',e=>f.nombre=e.target.value);
  const ai=inp('text','Apellido',''); ai.addEventListener('input',e=>f.apellido=e.target.value);
  const di=inp('tel','12345678',''); di.addEventListener('input',e=>f.doc=e.target.value);
  const ci=inp('tel','+54 9 11...',''); ci.addEventListener('input',e=>f.cel=e.target.value);
  const bi=inp('date','',''); bi.addEventListener('input',e=>f.nac=e.target.value);
  const dri=h('textarea',{placeholder:'Calle, numero, ciudad'}); dri.addEventListener('input',e=>f.dir=e.target.value);
  const acSel=sel([['','Seleccionar...'],['Kick Boxing','Kick Boxing'],['Muay Thai','Muay Thai'],['K1','K1'],['Infantiles','Infantiles']],'',e=>f.actividad=e.target.value);
  const arSel=sel([['','Seleccionar arancel...'],...ARANCELES.map(a=>[a.id,'$'+a.precio.toLocaleString('es-AR')+' ? '+a.label])],'',e=>{ const a=ARANCELES.find(x=>x.id===Number(e.target.value)); f.arancel=a?.precio||0; f.arancelLabel=a?.label||''; });
  const belts=['Blanco','Amarillo','Naranja','Verde','Azul','Marron','Negro'];
  const beltRow=div('belt-row');
  belts.forEach(b=>{ const bo=h('button',{class:'belt-opt'+(b==='Blanco'?' belt-on':''),onClick:()=>{ f.belt=b; beltRow.querySelectorAll('.belt-opt').forEach(x=>x.className='belt-opt'); bo.className='belt-opt belt-on'; }},b); beltRow.appendChild(bo); });
  const pi=inp('password','????',''); pi.maxLength=4; pi.addEventListener('input',e=>f.pin=e.target.value);
  const vi=inp('date','',''); vi.addEventListener('input',e=>f.venc=e.target.value);
  const oi=h('textarea',{placeholder:'Notas medicas, emergencias...'}); oi.addEventListener('input',e=>f.obs=e.target.value);
  const errEl=div(''); errEl.style.cssText='color:#ef4444;font-size:13px;text-align:center;margin-top:8px';
  const saveBtn=btn('btn-primary','GUARDAR ALUMNO',()=>{
    if(!f.nombre||!f.apellido){ errEl.textContent='?? Nombre y apellido requeridos'; return; }
    STATE.members.push({...f,id:Date.now(),quotas:[]});
    save('members'); STATE.modal=null; toast('? Alumno agregado'); render();
  });
  const content=div('',field('Nombre',ni),field('Apellido',ai),field('DNI',di),field('Celular',ci),field('Fecha de Nacimiento',bi),field('Direccion',dri),field('Actividad',acSel),field('Arancel',arSel),h('div',{class:'field'},h('label',{},'Cinturon / Nivel'),beltRow),field('PIN del alumno (4 digitos)',pi),field('Vencimiento de Cuota',vi),field('Observaciones',oi),saveBtn,errEl);
  return modalWrap('NUEVO ALUMNO',content);
}

function modalViewMember(){
  const m=STATE.modalData.member;
  if(!m) return div('');
  const d=daysUntil(m.venc);
  const inact=isInactive(m.id);
  let bClass,bLabel;
  if(inact){bClass='bg-purple';bLabel='INACTIVO';}
  else if(d===null){bClass='bg-muted';bLabel='SIN CUOTA';}
  else if(d<0){bClass='bg-red';bLabel='VENCIDA';}
  else if(d<=3){bClass='bg-gold';bLabel='POR VENCER';}
  else{bClass='bg-green';bLabel='ACTIVO';}
  const age=m.nac?Math.floor((new Date()-new Date(m.nac))/31557600000):null;
  const hero=div('profile-hero');
  hero.appendChild(div('ph-av',initials(m.nombre,m.apellido)));
  const hi=div('');
  hi.appendChild(div('ph-name',m.nombre+' '+m.apellido));
  hi.appendChild(h('div',{style:'font-size:12px;color:rgba(255,255,255,.7);margin-top:4px'},(m.actividad||'')+' ? '+(m.belt||'')));
  hi.appendChild(h('div',{style:'margin-top:8px'},h('span',{class:'badge '+bClass},bLabel)));
  hero.appendChild(hi);
  const details=div('');
  [['DNI',m.doc],['Celular',m.cel],['Nacimiento',m.nac?(fmtDate(m.nac)+(age?' ('+age+' anos)':'')):null],['Direccion',m.dir],['Arancel',m.arancelLabel?(m.arancelLabel+' ? $'+(m.arancel||0).toLocaleString('es-AR')):null],['Venc. Cuota',fmtDate(m.venc)],['Observaciones',m.obs]].filter(([,v])=>v).forEach(([l,v])=>{ const r=div('dr'); r.appendChild(h('span',{class:'dl'},l)); r.appendChild(h('span',{style:'font-size:13px'},v)); details.appendChild(r); });
  if(inact){ const al=div('alert alert-purple'); al.style.marginTop='10px'; al.appendChild(h('span',{},'?')); al.appendChild(h('div',{},'Sin asistencia en 14 dias. Se envio mensaje automatico.')); details.appendChild(al); }
  const qTitle=h('div',{style:'font-family:Bebas Neue,cursive;font-size:14px;letter-spacing:2px;color:#aaaacc;margin-bottom:8px'},'HISTORIAL DE CUOTAS');
  const qList=div('');
  if(!m.quotas||!m.quotas.length) qList.appendChild(h('div',{style:'color:#aaaacc;font-size:13px;text-align:center;padding:8px 0'},'Sin pagos'));
  else [...m.quotas].reverse().forEach(q=>{ const r=div('quota-row'); r.appendChild(div('',h('div',{style:'font-weight:700;font-size:14px;color:#fff'},q.mes),h('div',{style:'font-size:11px;color:#aaaacc'},q.metodo))); r.appendChild(div('tx-amt ing','$'+(q.monto||0).toLocaleString('es-AR'))); qList.appendChild(r); });
  const btns=div(''); btns.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:12px';
  btns.appendChild(btn('btn-green btn-sm','+ PAGO',()=>{ STATE.modal='pay-quota'; render(); }));
  btns.appendChild(btn('btn-red btn-sm','? ELIMINAR',()=>{ if(!confirm('?Eliminar a '+m.nombre+' '+m.apellido+'?')) return; STATE.members=STATE.members.filter(x=>x.id!==m.id); save('members'); STATE.modal=null; toast('? Eliminado'); render(); }));
  const content=div('',hero,details,h('div',{class:'divider'}),qTitle,qList,btns);
  return modalWrap('FICHA ALUMNO',content);
}

function modalPayQuota(){
  const m=STATE.modalData.member;
  if(!m) return div('');
  let mes=new Date().toISOString().slice(0,7), monto='', venc='', met='Efectivo';
  const mi=inp('month','',mes); mi.addEventListener('input',e=>mes=e.target.value);
  const amti=inp('number','0.00',''); amti.addEventListener('input',e=>monto=e.target.value);
  const vi=inp('date','',venc); vi.addEventListener('input',e=>venc=e.target.value);
  const metSel=sel([['Efectivo','Efectivo'],['Transferencia','Transferencia'],['Tarjeta','Tarjeta'],['MercadoPago','MercadoPago']],met,e=>met=e.target.value);
  const saveBtn=btn('btn-primary','CONFIRMAR PAGO',()=>{
    const amt=parseFloat(monto); if(!amt){ toast('?? Ingresa un monto'); return; }
    STATE.members=STATE.members.map(x=>x.id!==m.id?x:{...x,venc,quotas:[...(x.quotas||[]),{mes,monto:amt,metodo:met,fecha:todayStr()}]});
    STATE.ingresos.push({id:Date.now(),desc:'Cuota '+mes+' - '+m.nombre+' '+m.apellido,monto:amt,fecha:todayStr(),cat:'Cuota mensual'});
    save('members'); save('ingresos'); STATE.modal=null; toast('? Pago registrado'); render();
  });
  const mInfo=div(''); mInfo.style.cssText='margin-bottom:12px;padding:9px 12px;background:#14141f;border-radius:8px;font-size:14px;color:#fff';
  mInfo.textContent='? '+m.nombre+' '+m.apellido;
  const content=div('',mInfo,field('Mes',mi),field('Monto',amti),field('Nuevo Vencimiento',vi),field('Metodo de Pago',metSel),saveBtn);
  return modalWrap('REGISTRAR PAGO',content);
}

function modalTrans(title,btnCls,btnLabel,cats,stateKey){
  let desc='',monto='',fecha=todayStr(),cat=cats[0];
  const di=inp('text','Descripcion...',''); di.addEventListener('input',e=>desc=e.target.value);
  const mi=inp('number','0.00',''); mi.addEventListener('input',e=>monto=e.target.value);
  const fi=inp('date','',fecha); fi.addEventListener('input',e=>fecha=e.target.value);
  const catSel=sel(cats.map(c=>[c,c]),cat,e=>cat=e.target.value);
  const saveBtn=btn(btnCls+' btn-block',btnLabel,()=>{
    const amt=parseFloat(monto); if(!amt) return;
    STATE[stateKey].push({id:Date.now(),desc,monto:amt,fecha,cat});
    save(stateKey); STATE.modal=null; toast('? Registrado'); render();
  });
  return modalWrap(title,div('',field('Descripcion',di),field('Monto',mi),field('Fecha',fi),field('Categoria',catSel),saveBtn));
}
